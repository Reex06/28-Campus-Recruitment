<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嵌入式学习打卡 · 28届秋招</title>
<style>
  :root{
    --bg:#0f1419; --panel:#171d26; --panel2:#1d2530; --border:#2a3442;
    --text:#e6edf3; --muted:#8b98a9; --accent:#4f9cf9;
    --green:#2ea043; --yellow:#d29922; --gray:#6e7681;
    --green-bg:rgba(46,160,67,.15); --yellow-bg:rgba(210,153,34,.15); --gray-bg:rgba(110,118,129,.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:24px 16px 60px;
    line-height:1.5;
  }
  .wrap{max-width:1080px; margin:0 auto;}
  header{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:20px;}
  h1{font-size:22px; font-weight:700; display:flex; align-items:center; gap:10px;}
  .dot{width:12px; height:12px; border-radius:50%; background:var(--accent); display:inline-block;}
  .sub{color:var(--muted); font-size:13px; margin-top:4px;}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  .btn{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:500;
    transition:all .15s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#06121f; font-weight:600;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-green{background:var(--green); border-color:var(--green); color:#04120a; font-weight:600;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .locked-badge, .edit-badge{
    font-size:12px; padding:4px 10px; border-radius:20px; font-weight:600;
  }
  .locked-badge{background:var(--gray-bg); color:var(--muted); border:1px solid var(--border);}
  .edit-badge{background:rgba(79,156,249,.15); color:var(--accent); border:1px solid var(--accent);}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px;}
  .stat{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px;}
  .stat .num{font-size:26px; font-weight:800;}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
  .stat.bar{padding-bottom:18px;}
  .pbar{height:8px; background:var(--panel2); border-radius:4px; margin-top:10px; overflow:hidden;}
  .pbar > i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),#7cc0ff); border-radius:4px; transition:width .4s;}

  .module{margin-bottom:20px;}
  .module-head{
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px 12px 0 0;
    cursor:pointer; user-select:none;
  }
  .module-head .arrow{transition:transform .2s; color:var(--muted); font-size:12px;}
  .module.collapsed .module-head .arrow{transform:rotate(-90deg);}
  .module.collapsed .module-body{display:none;}
  .module-name{font-weight:700; font-size:15px; flex:1;}
  .module-meta{font-size:12px; color:var(--muted); display:flex; gap:14px; align-items:center;}

  .module-body{background:var(--panel); border:1px solid var(--border); border-top:none; border-radius:0 0 12px 12px; overflow:hidden;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; padding:10px 12px; background:var(--panel2); color:var(--muted);
    font-weight:600; font-size:12px; border-bottom:1px solid var(--border);
    position:sticky; top:0;
  }
  tbody td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,.02);}

  .item-name{font-weight:500;}
  .status-pill{
    display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:20px;
    font-size:12px; font-weight:600; white-space:nowrap;
  }
  .status-pill::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor;}
  .st-done{background:var(--green-bg); color:var(--green);}
  .st-study{background:var(--yellow-bg); color:var(--yellow);}
  .st-plan{background:var(--gray-bg); color:var(--gray);}

  .prog-wrap{display:flex; align-items:center; gap:8px; min-width:120px;}
  .prog-bar{flex:1; height:7px; background:var(--panel2); border-radius:4px; overflow:hidden;}
  .prog-bar > i{display:block; height:100%; background:var(--accent); border-radius:4px;}
  .prog-num{font-size:12px; color:var(--muted); min-width:34px; text-align:right;}
  .prog-input{
    width:52px; background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:4px 6px; font-size:12.5px;
  }

  td input[type="date"], td input[type="text"]{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; font-size:13px; width:100%;
  }
  td input:disabled{opacity:.5; cursor:not-allowed; background:transparent; border-color:transparent; padding-left:0;}

  select{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; font-size:13px;
  }
  select:disabled{opacity:.5; cursor:not-allowed; border-color:transparent; background:transparent; appearance:none; -webkit-appearance:none;}

  .modal-mask{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal-mask.show{display:flex;}
  .modal{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:24px; width:100%; max-width:380px;}
  .modal h3{margin-bottom:6px; font-size:16px;}
  .modal p{color:var(--muted); font-size:13px; margin-bottom:16px;}
  .modal input{width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:14px; margin-bottom:12px;}
  .modal .actions{display:flex; gap:10px; justify-content:flex-end;}
  .err{color:#f85149; font-size:12px; margin-bottom:8px; display:none;}
  .err.show{display:block;}

  footer{margin-top:28px; text-align:center; color:var(--muted); font-size:12px;}
  a{color:var(--accent); text-decoration:none;}
  .hint{color:var(--muted); font-size:12px;}

  @media (max-width:640px){
    .module-head{flex-wrap:wrap;}
    thead th:nth-child(4), tbody td:nth-child(4){display:none;}
    table{font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="dot"></span>嵌入式学习打卡</h1>
      <div class="sub">目标：2027 年 8–9 月 · 28 届秋招 · 倒计时从 2026-11-01 算起</div>
    </div>
    <div class="toolbar">
      <span id="modeBadge" class="locked-badge">🔒 只读模式</span>
    </div>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="num" id="statDone">0</div>
      <div class="lbl">已结束 🟢</div>
    </div>
    <div class="stat">
      <div class="num" id="statStudy">0</div>
      <div class="lbl">学习中 🟡</div>
    </div>
    <div class="stat">
      <div class="num" id="statPlan">0</div>
      <div class="lbl">计划中 ⚪</div>
    </div>
    <div class="stat bar">
      <div class="num" id="statPct">0%</div>
      <div class="lbl">总体学习进度</div>
      <div class="pbar"><i id="statBar" style="width:0%"></i></div>
    </div>
  </div>

  <div id="root"></div>

  <footer>
    <div>打卡进度由本人维护 · 访客只读</div>
  </footer>
</div>

<script src="data.js"></script>
<script>
(function(){
  // ---------- 配置 ----------
  var STATUS = {
    plan:  { label:"计划中", color:"st-plan"  },
    study: { label:"学习中", color:"st-study" },
    done:  { label:"已结束", color:"st-done"  }
  };

  var data = window.CHECKIN_DATA;   // 只读渲染仓库 data.js 的数据

  // ---------- 渲染 ----------
  function renderStats(){
    var done=0, study=0, plan=0, sum=0, n=0;
    data.modules.forEach(function(m){
      m.items.forEach(function(it){
        n++;
        sum += (it.progress||0);
        if(it.status==="done") done++;
        else if(it.status==="study") study++;
        else plan++;
      });
    });
    var pct = n ? Math.round(sum/n) : 0;
    document.getElementById("statDone").textContent = done;
    document.getElementById("statStudy").textContent = study;
    document.getElementById("statPlan").textContent = plan;
    document.getElementById("statPct").textContent = pct + "%";
    document.getElementById("statBar").style.width = pct + "%";
  }

  function renderTable(){
    var root = document.getElementById("root");
    root.innerHTML = "";
    data.modules.forEach(function(m){
      var sec = document.createElement("div");
      sec.className = "module";

      var doneCount = 0;
      m.items.forEach(function(it){ if(it.status==="done") doneCount++; });
      var avg = m.items.length ? Math.round(m.items.reduce(function(a,it){return a+(it.progress||0);},0)/m.items.length) : 0;

      var head = document.createElement("div");
      head.className = "module-head";
      head.innerHTML = '<span class="arrow">▼</span>' +
        '<span class="module-name"></span>' +
        '<span class="module-meta">' +
          '<span>进度 ' + avg + '%</span>' +
          '<span>' + doneCount + '/' + m.items.length + ' 完成</span>' +
        '</span>';
      head.querySelector(".module-name").textContent = m.name;
      head.addEventListener("click", function(){ sec.classList.toggle("collapsed"); });
      sec.appendChild(head);

      var body = document.createElement("div");
      body.className = "module-body";
      var tbl = document.createElement("table");
      var thead = document.createElement("thead");
      thead.innerHTML = '<tr>' +
        '<th>学习内容</th><th>状态</th><th>学习进度</th>' +
        '<th>规划时间</th><th>完成时间</th></tr>';
      tbl.appendChild(thead);

      var tbody = document.createElement("tbody");
      m.items.forEach(function(it){
        var tr = document.createElement("tr");

        var tdName = document.createElement("td");
        tdName.className = "item-name";
        tdName.textContent = it.name;
        tr.appendChild(tdName);

        var tdStatus = document.createElement("td");
        var pill = document.createElement("span");
        var st = STATUS[it.status] || STATUS.plan;
        pill.className = "status-pill " + st.color;
        pill.textContent = st.label;
        tdStatus.appendChild(pill);
        tr.appendChild(tdStatus);

        var tdProg = document.createElement("td");
        var progWrap = document.createElement("div");
        progWrap.className = "prog-wrap";
        var bar = document.createElement("div");
        bar.className = "prog-bar";
        var fill = document.createElement("i");
        fill.style.width = (it.progress||0) + "%";
        bar.appendChild(fill);
        var num = document.createElement("span");
        num.className = "prog-num";
        num.textContent = (it.progress||0) + "%";
        progWrap.appendChild(bar);
        progWrap.appendChild(num);
        tdProg.appendChild(progWrap);
        tr.appendChild(tdProg);

        var tdPlan = document.createElement("td");
        tdPlan.textContent = it.planTime || "";
        tr.appendChild(tdPlan);

        var tdDone = document.createElement("td");
        tdDone.textContent = it.doneTime || "";
        tr.appendChild(tdDone);

        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      body.appendChild(tbl);
      sec.appendChild(body);
      root.appendChild(sec);
    });
  }

  renderTable();
  renderStats();
})();
</script>
</body>
</html>
