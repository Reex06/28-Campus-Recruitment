<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嵌入式学习打卡 · 28届秋招</title>
<style>
  :root{
    --bg:#0f1419; --panel:#171d26; --panel2:#1d2530; --border:#2a3442;
    --text:#e6edf3; --muted:#8b98a9; --accent:#4f9cf9;
    --green:#2ea043; --yellow:#d29922; --gray:#6e7681;
    --green-bg:rgba(46,160,67,.15); --yellow-bg:rgba(210,153,34,.15); --gray-bg:rgba(110,118,129,.12);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:24px 16px 60px;
    line-height:1.5;
  }
  .wrap{max-width:1080px; margin:0 auto;}
  header{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:20px;}
  h1{font-size:22px; font-weight:700; display:flex; align-items:center; gap:10px;}
  .dot{width:12px; height:12px; border-radius:50%; background:var(--accent); display:inline-block;}
  .sub{color:var(--muted); font-size:13px; margin-top:4px;}
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

  .btn{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    padding:8px 14px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:500;
    transition:all .15s;
  }
  .btn:hover{border-color:var(--accent);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#06121f; font-weight:600;}
  .btn-primary:hover{filter:brightness(1.1);}
  .btn-green{background:var(--green); border-color:var(--green); color:#04120a; font-weight:600;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}

  .locked-badge, .edit-badge{
    font-size:12px; padding:4px 10px; border-radius:20px; font-weight:600;
  }
  .locked-badge{background:var(--gray-bg); color:var(--muted); border:1px solid var(--border);}
  .edit-badge{background:rgba(79,156,249,.15); color:var(--accent); border:1px solid var(--accent);}

  .hint-banner{background:var(--panel); border:1px solid var(--accent); border-radius:10px; padding:10px 14px; font-size:13px; color:var(--muted); margin-bottom:20px; display:none;}
  .hint-banner a{color:var(--accent);}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:22px;}
  .stat{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px;}
  .stat .num{font-size:26px; font-weight:800;}
  .stat .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
  .stat.bar{padding-bottom:18px;}
  .pbar{height:8px; background:var(--panel2); border-radius:4px; margin-top:10px; overflow:hidden;}
  .pbar > i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),#7cc0ff); border-radius:4px; transition:width .4s;}

  .module{margin-bottom:20px;}
  .module-head{
    display:flex; align-items:center; gap:12px; padding:12px 16px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px 12px 0 0;
    cursor:pointer; user-select:none;
  }
  .module-head .arrow{transition:transform .2s; color:var(--muted); font-size:12px;}
  .module.collapsed .module-head .arrow{transform:rotate(-90deg);}
  .module.collapsed .module-body{display:none;}
  .module-name{font-weight:700; font-size:15px; flex:1;}
  .module-meta{font-size:12px; color:var(--muted); display:flex; gap:14px; align-items:center;}

  .module-body{background:var(--panel); border:1px solid var(--border); border-top:none; border-radius:0 0 12px 12px; overflow:hidden;}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  thead th{
    text-align:left; padding:10px 12px; background:var(--panel2); color:var(--muted);
    font-weight:600; font-size:12px; border-bottom:1px solid var(--border);
    position:sticky; top:0;
  }
  tbody td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:rgba(255,255,255,.02);}

  .item-name{font-weight:500;}
  .status-pill{
    display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:20px;
    font-size:12px; font-weight:600; white-space:nowrap;
  }
  .status-pill::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor;}
  .st-done{background:var(--green-bg); color:var(--green);}
  .st-study{background:var(--yellow-bg); color:var(--yellow);}
  .st-plan{background:var(--gray-bg); color:var(--gray);}

  .prog-wrap{display:flex; align-items:center; gap:8px; min-width:120px;}
  .prog-bar{flex:1; height:7px; background:var(--panel2); border-radius:4px; overflow:hidden;}
  .prog-bar > i{display:block; height:100%; background:var(--accent); border-radius:4px;}
  .prog-num{font-size:12px; color:var(--muted); min-width:34px; text-align:right;}
  .prog-input{
    width:60px; background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:4px 6px; font-size:12.5px;
  }

  td input[type="date"], td input[type="text"]{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; font-size:13px; width:100%;
  }
  td input:disabled{opacity:.55; cursor:not-allowed; background:transparent; border-color:transparent; padding-left:0;}

  select{
    background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:5px 8px; font-size:13px;
  }

  .modal-mask{position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal-mask.show{display:flex;}
  .modal{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:24px; width:100%; max-width:420px;}
  .modal h3{margin-bottom:6px; font-size:16px;}
  .modal p{color:var(--muted); font-size:13px; margin-bottom:12px;}
  .modal p a{color:var(--accent);}
  .modal input{width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-size:14px; margin-bottom:12px;}
  .modal .actions{display:flex; gap:10px; justify-content:flex-end;}
  .err{color:#f85149; font-size:12px; margin-bottom:8px; display:none;}
  .err.show{display:block;}

  footer{margin-top:28px; text-align:center; color:var(--muted); font-size:12px;}
  a{color:var(--accent); text-decoration:none;}
  .hint{color:var(--muted); font-size:12px;}

  @media (max-width:640px){
    .module-head{flex-wrap:wrap;}
    thead th:nth-child(4), tbody td:nth-child(4){display:none;}
    table{font-size:12.5px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="dot"></span>嵌入式学习打卡</h1>
      <div class="sub">目标：2027 年 8–9 月 · 28 届秋招 · 倒计时从 2026-11-01 算起</div>
    </div>
    <div class="toolbar">
      <span id="modeBadge" class="locked-badge">🔒 只读模式</span>
      <button class="btn" id="btnOwner" style="display:none;">🔓 我是主人</button>
      <button class="btn" id="btnExit" style="display:none;">🔒 退出编辑</button>
      <button class="btn btn-primary" id="btnSave" disabled>💾 保存并同步</button>
    </div>
  </header>

  <div id="banner" class="hint-banner"></div>

  <div class="stats">
    <div class="stat">
      <div class="num" id="statDone">0</div>
      <div class="lbl">已结束 🟢</div>
    </div>
    <div class="stat">
      <div class="num" id="statStudy">0</div>
      <div class="lbl">学习中 🟡</div>
    </div>
    <div class="stat">
      <div class="num" id="statPlan">0</div>
      <div class="lbl">计划中 ⚪</div>
    </div>
    <div class="stat bar">
      <div class="num" id="statPct">0%</div>
      <div class="lbl">总体学习进度</div>
      <div class="pbar"><i id="statBar" style="width:0%"></i></div>
    </div>
  </div>

  <div id="root"></div>

  <footer>
    <div id="footLine">打卡进度由本人维护 · 访客只读</div>
    <div class="hint" id="footLogout" style="display:none; margin-top:6px;"><a href="#" id="linkLogout">清除本机保存的 Token</a></div>
  </footer>
</div>

<!-- 主人 Token 弹窗 -->
<div class="modal-mask" id="tokenMask">
  <div class="modal">
    <h3>🔓 主人登录</h3>
    <p>输入你的 GitHub Personal Access Token（只存在你本浏览器，不上传）。如何获取见
       <a href="https://github.com/settings/tokens" target="_blank" rel="noopener">这里</a>，勾选 <b>repo</b> 权限即够用。</p>
    <div class="err" id="tokenErr"></div>
    <input type="password" id="tokenInput" placeholder="ghp_..." autocomplete="off">
    <div class="actions">
      <button class="btn" id="tokenCancel">取消</button>
      <button class="btn btn-primary" id="tokenOk">登录</button>
    </div>
    <p class="hint" style="margin-top:12px; text-align:center;">仓库：<span id="modalRepo"></span></p>
  </div>
</div>

<script src="data.js"></script>
<script>
// 仓库信息跟随部署脚本（deploy.sh）里的用户名/仓库名，需要保持一致时改这两项
window.REPO_CONFIG = {
  owner: "Reex06",
  repo: "learning-checkin",
  branch: "main"
};
</script>
<script>
(function(){
  "use strict";

  var REPO = window.REPO_CONFIG;
  var STORAGE_KEY = "checkin_owner_token_v1";
  var STATUS = {
    plan:  { label:"计划中", color:"st-plan"  },
    study: { label:"学习中", color:"st-study" },
    done:  { label:"已结束", color:"st-done"  }
  };

  // 工作数据：从 data.js 深拷贝一份，改动都先落在这里，点保存才写回仓库
  var data = JSON.parse(JSON.stringify(window.CHECKIN_DATA));
  var unlocked = false;

  // ---------- 渲染 ----------
  function renderStats(){
    var done=0, study=0, plan=0, sum=0, n=0;
    data.modules.forEach(function(m){
      m.items.forEach(function(it){
        n++;
        sum += (it.progress||0);
        if(it.status==="done") done++;
        else if(it.status==="study") study++;
        else plan++;
      });
    });
    var pct = n ? Math.round(sum/n) : 0;
    document.getElementById("statDone").textContent = done;
    document.getElementById("statStudy").textContent = study;
    document.getElementById("statPlan").textContent = plan;
    document.getElementById("statPct").textContent = pct + "%";
    document.getElementById("statBar").style.width = pct + "%";
  }

  function renderTable(){
    var root = document.getElementById("root");
    root.innerHTML = "";
    data.modules.forEach(function(m, mi){
      var sec = document.createElement("div");
      sec.className = "module";

      var doneCount = 0;
      m.items.forEach(function(it){ if(it.status==="done") doneCount++; });
      var avg = m.items.length ? Math.round(m.items.reduce(function(a,it){return a+(it.progress||0);},0)/m.items.length) : 0;

      var head = document.createElement("div");
      head.className = "module-head";
      head.innerHTML = '<span class="arrow">▼</span>' +
        '<span class="module-name"></span>' +
        '<span class="module-meta">' +
          '<span>进度 ' + avg + '%</span>' +
          '<span>' + doneCount + '/' + m.items.length + ' 完成</span>' +
        '</span>';
      head.querySelector(".module-name").textContent = m.name;
      head.addEventListener("click", function(){ sec.classList.toggle("collapsed"); });
      sec.appendChild(head);

      var body = document.createElement("div");
      body.className = "module-body";
      var tbl = document.createElement("table");
      var thead = document.createElement("thead");
      thead.innerHTML = '<tr>' +
        '<th>学习内容</th><th>状态</th><th>学习进度</th>' +
        '<th>规划时间</th><th>完成时间</th></tr>';
      tbl.appendChild(thead);

      var tbody = document.createElement("tbody");
      m.items.forEach(function(it, ii){
        var tr = document.createElement("tr");

        var tdName = document.createElement("td");
        tdName.className = "item-name";
        tdName.textContent = it.name;
        tr.appendChild(tdName);

        // 状态列
        var tdStatus = document.createElement("td");
        if(unlocked){
          var sel = document.createElement("select");
          sel.dataset.act = "status"; sel.dataset.mi = mi; sel.dataset.ii = ii;
          Object.keys(STATUS).forEach(function(k){
            var o = document.createElement("option");
            o.value = k; o.textContent = STATUS[k].label;
            if(it.status===k) o.selected = true;
            sel.appendChild(o);
          });
          sel.addEventListener("change", onEdit);
          tdStatus.appendChild(sel);
        } else {
          var pill = document.createElement("span");
          var st = STATUS[it.status] || STATUS.plan;
          pill.className = "status-pill " + st.color;
          pill.textContent = st.label;
          tdStatus.appendChild(pill);
        }
        tr.appendChild(tdStatus);

        // 进度列
        var tdProg = document.createElement("td");
        var progWrap = document.createElement("div");
        progWrap.className = "prog-wrap";
        var bar = document.createElement("div");
        bar.className = "prog-bar";
        var fill = document.createElement("i");
        fill.style.width = (it.progress||0) + "%";
        bar.appendChild(fill);
        progWrap.appendChild(bar);
        if(unlocked){
          var progInput = document.createElement("input");
          progInput.type = "number";
          progInput.min = "0"; progInput.max = "100";
          progInput.value = (it.progress||0);
          progInput.className = "prog-input";
          progInput.dataset.act = "progress"; progInput.dataset.mi = mi; progInput.dataset.ii = ii;
          progInput.addEventListener("change", onEdit);
          progWrap.appendChild(progInput);
          progWrap.appendChild(document.createTextNode("%"));
        } else {
          var num = document.createElement("span");
          num.className = "prog-num";
          num.textContent = (it.progress||0) + "%";
          progWrap.appendChild(num);
        }
        tdProg.appendChild(progWrap);
        tr.appendChild(tdProg);

        // 规划时间列
        var tdPlan = document.createElement("td");
        var planInput = document.createElement("input");
        planInput.type = "text";
        planInput.value = it.planTime || "";
        planInput.placeholder = "如：2 周 / 19 节";
        planInput.dataset.act = "planTime"; planInput.dataset.mi = mi; planInput.dataset.ii = ii;
        if(unlocked){ planInput.addEventListener("change", onEdit); }
        else { planInput.disabled = true; }
        tdPlan.appendChild(planInput);
        tr.appendChild(tdPlan);

        // 完成时间列
        var tdDone = document.createElement("td");
        var doneInput = document.createElement("input");
        doneInput.type = "date";
        doneInput.value = it.doneTime || "";
        doneInput.dataset.act = "doneTime"; doneInput.dataset.mi = mi; doneInput.dataset.ii = ii;
        if(unlocked){ doneInput.addEventListener("change", onEdit); }
        else { doneInput.disabled = true; }
        tdDone.appendChild(doneInput);
        tr.appendChild(tdDone);

        tbody.appendChild(tr);
      });
      tbl.appendChild(tbody);
      body.appendChild(tbl);
      sec.appendChild(body);
      root.appendChild(sec);
    });
  }

  function refresh(){
    renderTable();
    renderStats();
  }

  // ---------- 编辑联动 ----------
  function onEdit(e){
    var t = e.target;
    var mi = parseInt(t.dataset.mi,10);
    var ii = parseInt(t.dataset.ii,10);
    var act = t.dataset.act;
    if(!data.modules[mi] || !data.modules[mi].items[ii]) return;
    var it = data.modules[mi].items[ii];

    if(act==="status"){
      it.status = t.value;
      if(t.value==="done" && !it.doneTime){ it.doneTime = today(); }
      else if(t.value!=="done"){ it.doneTime = ""; }
    } else if(act==="planTime"){
      it.planTime = t.value;
    } else if(act==="doneTime"){
      it.doneTime = t.value;
    } else if(act==="progress"){
      var p = parseInt(t.value,10);
      if(isNaN(p)) p = 0;
      p = Math.max(0, Math.min(100, p));
      it.progress = p;
      if(p>=100 && it.status!=="done"){ it.status = "done"; if(!it.doneTime) it.doneTime = today(); }
      else if(p>0 && p<100 && it.status==="plan"){ it.status = "study"; }
      else if(p===0 && it.status==="study"){ it.status = "plan"; }
    }
    refresh();
  }

  function today(){
    return new Date().toISOString().slice(0,10);
  }

  // ---------- Token / 登录 ----------
  function getToken(){
    var t = localStorage.getItem(STORAGE_KEY);
    return t || "";
  }
  function setToken(t){ if(t) localStorage.setItem(STORAGE_KEY, t); else localStorage.removeItem(STORAGE_KEY); }
  function hasToken(){ return !!getToken(); }

  function openTokenModal(){
    document.getElementById("modalRepo").textContent = REPO.owner + "/" + REPO.repo;
    document.getElementById("tokenErr").classList.remove("show");
    document.getElementById("tokenErr").textContent = "";
    document.getElementById("tokenInput").value = "";
    document.getElementById("tokenMask").classList.add("show");
    setTimeout(function(){ document.getElementById("tokenInput").focus(); }, 50);
  }
  function closeTokenModal(){
    document.getElementById("tokenMask").classList.remove("show");
  }

  function applyToken(t){
    setToken(t);
    closeTokenModal();
    unlocked = true;
    updateMode();
  }

  function tryLogin(){
    var v = document.getElementById("tokenInput").value.trim();
    var err = document.getElementById("tokenErr");
    if(!v){ err.textContent="请输入 Token"; err.classList.add("show"); return; }
    // 简单校验 + 校验 token 是否有效且是否有 repo 权限
    err.classList.remove("show");
    verifyToken(v).then(function(ok){
      if(ok){ applyToken(v); }
      else {
        err.textContent = "Token 无效或缺少 repo 权限，请检查。";
        err.classList.add("show");
      }
    }).catch(function(){
      err.textContent = "校验 Token 失败（可能是网络问题）。";
      err.classList.add("show");
    });
  }

  function verifyToken(token){
    return fetch("https://api.github.com/user", {
      headers: {
        "Authorization": "token " + token,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
      }
    }).then(function(r){
      if(!r.ok) return false;
      return r.json().then(function(u){
        // 校验登录用户就是仓库 owner
        if(u.login && u.login.toLowerCase() === REPO.owner.toLowerCase()) return true;
        return false;
      }).catch(function(){ return false; });
    });
  }

  // ---------- 保存并同步到仓库 ----------
  function serializable(){
    var obj = {
      version: data.version,
      updatedAt: today(),
      modules: data.modules
    };
    return obj;
  }

  function buildDataJsContent(){
    var obj = serializable();
    return "// =============================================================\n" +
           "// 学习打卡数据文件\n" +
           "// 此文件由「打卡页面」的【保存并同步】按钮自动生成并提交到 GitHub 仓库，\n" +
           "// 访客访问线上页面时读到的是这里的数据。\n" +
           "// 结构：大模块 modules[] → 每个模块下的 items[] 小模块\n" +
           "// =============================================================\n" +
           "window.CHECKIN_DATA = " + JSON.stringify(obj, null, 2) + ";\n";
  }

  function setBusy(busy, msg){
    var btn = document.getElementById("btnSave");
    if(busy){ btn.disabled = true; btn.textContent = msg || "同步中…"; }
    else { btn.disabled = false; btn.textContent = "💾 保存并同步"; }
  }

  function showBanner(type, text){
    var b = document.getElementById("banner");
    b.style.display = "block";
    b.style.borderColor = type==="error" ? "#f85149" : "var(--accent)";
    b.style.color = type==="error" ? "#f85149" : "var(--muted)";
    b.textContent = text;
  }
  function hideBanner(){ document.getElementById("banner").style.display = "none"; }

  // GitHub API：写 data.js
  function apiGetFile(path){
    return fetch("https://api.github.com/repos/" + REPO.owner + "/" + REPO.repo + "/contents/" + encodeURIComponent(path), {
      headers: authHeaders()
    });
  }
  function authHeaders(){
    return {
      "Authorization": "token " + getToken(),
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    };
  }

  function saveToRepo(){
    var token = getToken();
    if(!token){ showBanner("error","尚未登录，请先点「🔓 我是主人」。"); return; }

    var content = buildDataJsContent();
    // base64：GitHub Contents API 要求 base64 编码
    var b64 = utf8ToBase64(content);
    var path = "data.js";

    setBusy(true, "同步中…");
    showBanner("info", "正在保存并推送 data.js 到仓库…");

    // 先 GET 拿到当前 data.js 的 SHA（改动必须携带 sha 才能更新）
    apiGetFile(path).then(function(r){
      if(!r.ok){
        return r.json().then(function(j){ throw new Error(j.message || ("GET 失败 " + r.status)); });
      }
      return r.json();
    }).then(function(file){
      var body = {
        message: "更新打卡进度 " + today(),
        content: b64,
        sha: file.sha,
        branch: REPO.branch
      };
      return fetch("https://api.github.com/repos/" + REPO.owner + "/" + REPO.repo + "/contents/" + encodeURIComponent(path), {
        method: "PUT",
        headers: authHeaders(),
        body: JSON.stringify(body)
      });
    }).then(function(r){
      if(!r.ok){
        return r.json().then(function(j){ throw new Error(j.message || ("PUT 失败 " + r.status)); });
      }
      return r.json();
    }).then(function(){
      setBusy(false);
      showBanner("info", "✅ 已保存并推送成功！访客刷新页面（约 1 分钟内生效）即可看到最新进度。");
    }).catch(function(e){
      var msg = e && e.message ? e.message : String(e);
      setBusy(false);
      showBanner("error", "❌ 保存失败：" + msg);
    });
  }

  function utf8ToBase64(str){
    // 兼容中文：先把字符串编码为 UTF-8 字节，再做 base64
    var bytes = new TextEncoder().encode(str);
    var bin = "";
    bytes.forEach(function(b){ bin += String.fromCharCode(b); });
    return btoa(bin);
  }

  // ---------- 模式切换 ----------
  function updateMode(){
    var badge = document.getElementById("modeBadge");
    var btnOwner = document.getElementById("btnOwner");
    var btnExit = document.getElementById("btnExit");
    var btnSave = document.getElementById("btnSave");
    var footLogout = document.getElementById("linkLogout");
    var banner = document.getElementById("banner");

    if(unlocked){
      badge.className = "edit-badge";
      badge.textContent = "✏️ 编辑模式";
      btnOwner.style.display = "none";
      btnExit.style.display = "inline-block";
      btnSave.disabled = false;
      footLogout.style.display = "inline";
    } else {
      badge.className = "locked-badge";
      badge.textContent = "🔒 只读模式";
      btnOwner.style.display = "inline-block";
      btnExit.style.display = "none";
      btnSave.disabled = true;
      footLogout.style.display = "none";
      hideBanner();
    }
    refresh();
  }

  // ---------- 事件绑定 ----------
  document.getElementById("btnOwner").addEventListener("click", openTokenModal);
  document.getElementById("btnExit").addEventListener("click", function(){
    unlocked = false;
    updateMode();
  });
  document.getElementById("btnSave").addEventListener("click", saveToRepo);
  document.getElementById("linkLogout").addEventListener("click", function(e){
    e.preventDefault();
    if(confirm("清除本机保存的 Token 并退出编辑？")){
      setToken("");
      unlocked = false;
      updateMode();
    }
  });

  document.getElementById("tokenOk").addEventListener("click", tryLogin);
  document.getElementById("tokenCancel").addEventListener("click", closeTokenModal);
  document.getElementById("tokenInput").addEventListener("keydown", function(e){
    if(e.key==="Enter") tryLogin();
  });
  document.getElementById("tokenMask").addEventListener("click", function(e){
    if(e.target===this) closeTokenModal();
  });

  // 启动：若本机已存有效 token，则默认进入编辑模式
  if(hasToken()){
    unlocked = true;
    document.getElementById("footLine").textContent = "打卡进度由本人维护 · 主人可直接编辑";
    updateMode();
    // 顺手校验 token 是否仍有效，失效则退出编辑
    verifyToken(getToken()).then(function(ok){ if(!ok){ unlocked = false; updateMode(); } });
  } else {
    updateMode();
  }
})();
</script>
</body>
</html>
